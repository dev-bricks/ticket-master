<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="tw_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="tw_shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="tw_armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="tw_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="800" rx="36" fill="url(#tw_bg)"/>
  <rect x="24" y="24" width="752" height="752" rx="28" fill="none" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Background Shield Emblem -->
  <path d="M 400 60 L 620 160 V 380 Q 400 600 400 660 Q 400 600 180 380 V 160 Z" fill="url(#tw_shield)" fill-opacity="0.15" stroke="#3b82f6" stroke-width="3" stroke-opacity="0.4"/>

  <!-- CHARACTER: SIG-TU (System Integrity Guardian) -->
  <!-- Sturdy Legs -->
  <rect x="330" y="520" width="55" height="150" rx="14" fill="#334155" stroke="#0f172a" stroke-width="4"/>
  <rect x="415" y="520" width="55" height="150" rx="14" fill="#334155" stroke="#0f172a" stroke-width="4"/>
  <path d="M 315 650 L 390 650 L 390 675 Q 350 680 315 675 Z" fill="#1e293b"/>
  <path d="M 410 650 L 485 650 L 485 675 Q 450 680 410 675 Z" fill="#1e293b"/>

  <!-- Armor Torso -->
  <path d="M 320 280 L 480 280 L 460 530 L 340 530 Z" fill="url(#tw_armor)" stroke="#0f172a" stroke-width="5"/>
  <!-- Guardian Crest on Chest -->
  <path d="M 400 310 L 435 330 V 370 Q 400 410 400 420 Q 400 410 365 370 V 330 Z" fill="#3b82f6" stroke="#ffffff" stroke-width="3"/>
  <text x="400" y="362" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">SIG</text>

  <!-- Left Arm holding Clipboard -->
  <path d="M 320 300 L 220 340 L 250 470" fill="none" stroke="#64748b" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Arm holding Magnifying Glass -->
  <path d="M 480 300 L 580 320 L 550 420" fill="none" stroke="#64748b" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Clipboard (Klemmbrett) -->
  <g transform="translate(140, 360) rotate(-6)">
    <rect x="0" y="0" width="160" height="220" rx="12" fill="#78350f" stroke="#451a03" stroke-width="4"/>
    <rect x="12" y="20" width="136" height="185" rx="6" fill="#f8fafc"/>
    <!-- Clip -->
    <rect x="50" y="-12" width="60" height="24" rx="4" fill="#94a3b8" stroke="#334155" stroke-width="3"/>

    <!-- Document Lines & Checkmarks -->
    <text x="25" y="50" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">PROOF AUDIT</text>
    <line x1="25" y1="60" x2="135" y2="60" stroke="#cbd5e1" stroke-width="2"/>

    <path d="M 25 80 L 33 88 L 48 72" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <rect x="55" y="74" width="70" height="8" rx="4" fill="#94a3b8"/>

    <path d="M 25 110 L 33 118 L 48 102" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <rect x="55" y="104" width="65" height="8" rx="4" fill="#94a3b8"/>

    <path d="M 25 140 L 33 148 L 48 132" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <rect x="55" y="134" width="55" height="8" rx="4" fill="#94a3b8"/>

    <!-- ABC Quality Stamp Badge -->
    <g transform="translate(100, 155) rotate(-12)">
      <circle cx="20" cy="20" r="26" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
      <text x="20" y="26" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="900">ABC</text>
    </g>
  </g>

  <!-- Magnifying Glass (Lupe) -->
  <g transform="translate(540, 360)">
    <line x1="0" y1="0" x2="-40" y2="90" stroke="#f59e0b" stroke-width="16" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="55" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="8" filter="url(#tw_glow)"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.6"/>
    <!-- Specular highlight on glass -->
    <path d="M -25 -25 Q 0 -40 25 -25" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Head & Helmet/Cape -->
  <!-- Helmet Shield -->
  <path d="M 325 160 Q 400 120 475 160 L 460 260 L 340 260 Z" fill="#475569" stroke="#0f172a" stroke-width="5"/>
  <!-- Visor / Face -->
  <rect x="350" y="180" width="100" height="60" rx="14" fill="#0f172a"/>
  <!-- Vigilant Calm Eyes -->
  <ellipse cx="380" cy="210" rx="10" ry="12" fill="#38bdf8" filter="url(#tw_glow)"/>
  <ellipse cx="420" cy="210" rx="10" ry="12" fill="#38bdf8" filter="url(#tw_glow)"/>
  <circle cx="382" cy="207" r="4" fill="#ffffff"/>
  <circle cx="422" cy="207" r="4" fill="#ffffff"/>

  <!-- Helmet Crest Antenna -->
  <path d="M 390 130 L 410 130 L 405 80 L 395 80 Z" fill="#3b82f6"/>
  <circle cx="400" cy="75" r="10" fill="#f59e0b"/>

  <!-- Title Badge -->
  <rect x="180" y="705" width="440" height="54" rx="27" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
  <text x="400" y="740" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" letter-spacing="1">SIG-TU · Integrity Guardian</text>
</svg>